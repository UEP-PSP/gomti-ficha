    // ── Fita da missão: fases com tarefas (o que fazer em cada momento) ──
    var FASE_HORA = { "2. Saída da unidade": ["hSai", "🚐 Saímos — registar hora"], "3. Chegada ao local": ["hCheg", "📍 Chegámos ao local — registar hora"], "6. Fim no local": ["hSaiL", "🏁 Saímos do local — registar hora"], "7. Regresso": ["hReg", "🏢 Chegámos à unidade — registar hora"] };

        if (c === "Com Comandante do Policiamento") return S.cmd === "sim";

        if (c === "Missão MNA") return S.equipas.some(function(e) { return e.tipo === "MNA"; });
        return true;
    }

        Object.keys(FASE_HORA).forEach(function(f) { if (nomes.indexOf(f) < 0) nomes.push(f); });
        [["1.", "1. Antes de sair"], ["4.", "4. Voos"], ["5.", "5. Durante a missão"]].forEach(function(x) { if (!nomes.some(function(n) { return n.indexOf(x[0]) === 0; })) nomes.push(x[1]); });

        if (semVoos()) nomes = nomes.filter(function(n) { return n.indexOf("4.") !== 0; });   // exposição: sem fase «Voos»

        return (q === "Equipa" && S.papel === "eq") || (q === "Comandante do PCT" && S.papel === "pct");

        return matSel("bt").filter(function(id) { return !usadas[id]; })[0] || "";
    }

    }

        document.getElementById("app").innerHTML = '<header style="background:#1a3a5c;color:#fff;padding:12px 14px;font:bold 18px Arial">📲 GOMTI — Ficha de missão</header>'
            + '<main style="max-width:700px;margin:0 auto;padding:10px;font:15px Arial,sans-serif">'
            + (msg ? '<div style="background:#fff3e0;border:1px solid #ffcc80;padding:8px;border-radius:6px;margin-bottom:8px">' + esc(msg) + '</div>' : '')
            + '<h3 style="color:#1a3a5c;margin:8px 0">Missões neste telemóvel</h3>'
            + (ix.length ? ix.map(function(x) {
                return '<div style="display:flex;gap:6px;margin:6px 0"><button data-m="' + esc(x.gerado) + '" style="flex:1;text-align:left;padding:12px;border:1px solid #1a6eb5;background:#fff;color:#1a3a5c;border-radius:6px;font-size:15px">'
                    + '<b>' + esc(x.codigo) + (x.sol ? ' · pedido #' + esc(x.sol) : '') + '</b><br><small>' + esc([x.data, x.local].filter(Boolean).join(" · ") || x.desc || "") + '</small></button>'
                    + '<button data-apagar="' + esc(x.gerado) + '" style="padding:0 12px;border:0;background:#c62828;color:#fff;border-radius:6px">🗑</button></div>';
            }).join("") : '<div style="color:#666">Ainda não há missões. Toque no link da missão enviado no WhatsApp, ou abra o ficheiro da missão.</div>')
            + '<h3 style="color:#1a3a5c;margin:16px 0 6px">Receber missão</h3>'
            + '<button id="hFich" style="width:100%;padding:13px;border:0;background:#1a6eb5;color:#fff;border-radius:6px;font-size:16px">📂 Abrir ficheiro de missão</button>'
            + '<input type="file" id="hFichInp" accept=".json,application/json" style="display:none"/>'
            + '<div style="margin-top:10px"><input id="hLink" placeholder="🔗 Colar aqui o link da missão" style="width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #b9c6d6;border-radius:5px"/></div>'
            + '<div style="color:#888;font-size:12px;margin-top:14px">Os dados ficam só neste telemóvel. No fim de cada missão, «📤 Partilhar» a ficha para o RM.</div></main>';
        var app = document.getElementById("app");
        app.oninput = app.onchange = null;          // largar os eventos da ficha anterior
        app.onclick = function(ev) {
            var b = ev.target.closest("button"); if (!b) return;
            if (b.getAttribute("data-m")) { abrirMissao(b.getAttribute("data-m")); return; }
            if (b.getAttribute("data-apagar")) {
                if (!confirm("Apagar esta missão deste telemóvel? (as fichas já partilhadas não se perdem)")) return;
                var g = b.getAttribute("data-apagar");
                try { localStorage.removeItem("GOMTI_MISSAO|" + g); } catch (e) {}
                lsSet(MIDX, lista().filter(function(x) { return x.gerado !== g; })); home(); return;
            }
            if (b.id === "hFich") document.getElementById("hFichInp").click();
        };
        document.getElementById("hFichInp").onchange = function() {
            var f = this.files[0]; if (!f) return;
            var rd = new FileReader();
            rd.onload = function() {
                var j = null; try { j = JSON.parse(rd.result); } catch (e) {}
                if (j && j.tipo === "GOMTI_MISSAO" && j.gerado) { guardarMissao(j); abrirMissao(j.gerado); return; }
                if (j && j.tipo === "GOMTI_FICHA_RM") { home("Esse ficheiro é uma ficha já preenchida: abra primeiro a missão e, dentro dela, «📂 Abrir»."); return; }
                home("Ficheiro inválido — escolha o ficheiro da missão (Missao_….json).");
            };
            rd.readAsText(f);
        };
        document.getElementById("hLink").oninput = function() {
            var v = this.value; if (!/m=/.test(v)) return;
            receber(v).then(function(D) { abrirMissao(D.gerado); }, function(e) { home(e.message); });
        };
    }
    window.GOMTI_HOME = function() { home(); };
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
    function doLink() {
        if (!/[#&]m=/.test(location.hash)) return false;
        var h = location.hash;
        try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
        receber(h).then(function(D) { abrirMissao(D.gerado); }, function(e) { home(e.message); });
        return true;
    }
    window.addEventListener("hashchange", doLink);      // link tocado com a app já aberta
    if (doLink()) return;
    var ix0 = lista();
    if (ix0.length === 1) abrirMissao(ix0[0].gerado);
    else home();
})();
</script></body></html>
